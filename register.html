<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinty.ai - Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div class="auth-page">
        <div class="auth-panel glass-panel">
            <div class="auth-head">
                <div class="logo">Infinty.ai</div>
                <p>Create your account and access the AI chat experience.</p>
            </div>

            <form id="register-form" class="auth-form">
                <div class="setting-group">
                    <label for="register-username">Username</label>
                    <input id="register-username" type="text" placeholder="Choose a username" required>
                </div>
                <div class="setting-group">
                    <label for="register-email">Email</label>
                    <input id="register-email" type="email" placeholder="you@example.com" required>
                </div>
                <div class="setting-group">
                    <label for="register-password">Password</label>
                    <input id="register-password" type="password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn primary-btn full-width">Register</button>
                <div class="auth-footer">Already registered? <a href="login.html">Sign in</a></div>
                <div id="register-message" class="auth-message"></div>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="js/register.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
